generated: '2026-07-14'
method: searched
source: https://developer.gocardless.com/resources/test-bank-details
description: >-
  GoCardless's sandbox / test-data surface — the test bank details, magic
  email/name values, and scenario simulators a developer needs to exercise the
  API end-to-end without money moving through the banking system. GoCardless
  separates sandbox and live by a completely different base host and access
  token (there is no key prefix); sandbox mandates and payments are never
  submitted to the real Bacs/SEPA/ACH schemes. Captured verbatim from the
  GoCardless developer test-bank-details and scenario-simulators references.
docs:
  - https://developer.gocardless.com/resources/test-bank-details
  - https://developer.gocardless.com/developer-tools/scenario-simulators
  - https://support.gocardless.com/hc/en-gb/articles/212553869-Sandbox-accounts

modes:
  - name: sandbox
    base_url: https://api-sandbox.gocardless.com
    dashboard: https://manage-sandbox.gocardless.com
    connect_oauth: https://connect-sandbox.gocardless.com/oauth/authorize
    notes: >-
      Full platform test environment. Payments and mandates are never submitted
      to the banking system; use scenario simulators or magic test details to
      drive lifecycle transitions. Requires a separate sandbox access token.
  - name: live
    base_url: https://api.gocardless.com
    dashboard: https://manage.gocardless.com
    connect_oauth: https://connect.gocardless.com/oauth/authorize

auth:
  scheme: Bearer access token (Authorization header)
  note: >-
    Sandbox and live use distinct access tokens issued from their respective
    dashboards. Unlike Stripe there is no key prefix — the environment is
    selected by base host.

