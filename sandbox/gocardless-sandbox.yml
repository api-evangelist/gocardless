# Magic values that route a sandbox flow to a specific behaviour.
magic_values:
  - {field: customer_email, value: protectplus_risky@gocardless.com, effect: Routes into the Verified Mandate (fraud/ProtectPlus) flow.}
  - {field: customer_email, value: bank-guess@gocardless.com, effect: Triggers the bank-guess feature.}
  - {field: modelbank_login, user: mits, password: mits, effect: ModelBank hosted open-banking test login.}

# Scenario simulators drive lifecycle transitions in sandbox.
# Payment/mandate simulators are selected by the customer given_name.
scenario_simulators:
  endpoint: POST /scenario_simulators/{id}/actions/run
  docs: https://developer.gocardless.com/api-reference/#core-endpoints-scenario-simulators
  payments_and_mandates:
    selector: customer.given_name
    values:
      - {name: Successful, outcome: 'Payment submitted then confirmed and paid out.'}
      - {name: Penniless, outcome: 'Payment submitted then failed (insufficient funds).'}
      - {name: Fickle, outcome: 'Payment confirmed and paid out, then later charged back.'}
      - {name: Late, outcome: 'Payment submitted, confirmed, then failed with delayed notification (late failure).'}
      - {name: Invalid, outcome: 'Mandate submitted then failed (bank details rejected).'}
      - {name: Expired, outcome: 'Mandate submitted, activated, then expired.'}
      - {name: Switching, outcome: 'Mandate submitted, active, then transferred via the UK current-account switching service.'}
  instalment_schedules:
    values:
      - {selector: customer.given_name, name: Successful, outcome: Schedule marked completed.}
      - {selector: customer.given_name, name: Penniless, outcome: Schedule marked errored.}
      - {selector: instalment_schedule.name, name: Faily, outcome: Schedule marked creation_failed.}
  outbound_payments:
    selector: outbound_payment.description
    values:
      - {value: failed_to_execute, outcome: 'executing then failed.'}
      - {value: failed_due_to_bank_rejection, outcome: 'executing then failed.'}
      - {value: failed_due_to_bank_rejection_after_execution, outcome: 'executing, executed, then failed.'}
      - {value: '<any other value>', outcome: 'executing then executed.'}

related:
