openapi: 3.1.0
info:
  title: GoCardless REST billing_request_flows mandates API
  version: '2015-07-06'
  description: 'Subset of the public GoCardless REST API for collecting bank debit and

    open-banking payments. Authentication uses a Bearer access token issued

    from the dashboard. Every request must include the

    `GoCardless-Version` header.

    '
  contact:
    name: GoCardless Developers
    url: https://developer.gocardless.com/
servers:
- url: https://api.gocardless.com
  description: Live
- url: https://api-sandbox.gocardless.com
  description: Sandbox
security:
- bearerAuth: []
tags:
- name: mandates
paths:
  /mandates:
    get:
      tags:
      - mandates
      summary: List mandates
      operationId: listMandates
      responses:
        '200':
          description: OK
    post:
      tags:
      - mandates
      summary: Create a mandate
      operationId: createMandate
      responses:
        '201':
          description: Created
  /mandates/{id}:
    get:
      tags:
      - mandates
      summary: Get a mandate
      operationId: getMandate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    put:
      tags:
      - mandates
      summary: Update a mandate
      operationId: updateMandate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /mandates/{id}/actions/cancel:
    post:
      tags:
      - mandates
      summary: Cancel a mandate
      operationId: cancelMandate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: GoCardless access token from the dashboard
